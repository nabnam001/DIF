<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Friendship emblem">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfbd6b"/>
      <stop offset="100%" stop-color="#b8862f"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#g)" stroke-width="1.5" opacity=".55"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#g)" stroke-width="1" opacity=".35"/>
  <!-- Star of David built from two triangles -->
  <g fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round">
    <polygon points="100,30 152,120 48,120"/>
    <polygon points="100,170 48,80 152,80"/>
  </g>
  <!-- Subtle Dannebrog cross inside -->
  <g fill="url(#g)" opacity=".22">
    <rect x="92" y="62" width="16" height="76" rx="2"/>
    <rect x="62" y="92" width="76" height="16" rx="2"/>
  </g>
</svg>
